# ============================================================
# Task Governor 受控后台任务执行器配置
# ============================================================

# 全局同时执行任务数的硬上限（工作线程数），任何时刻不会超过
governor.max-concurrency=4

# 单个调用来源允许排队的任务数上限，超出立即拒绝（HTTP 429）
governor.max-queued-per-source=8

# 全局排队任务数上限，超出立即拒绝（HTTP 429）
governor.max-queued-global=64

# 提交方未指定 timeoutMillis 时使用的默认截止时长（毫秒）
governor.default-timeout-millis=5000

# 提交方允许申请的最大截止时长（毫秒）
governor.max-timeout-millis=60000

# 终态任务在内存中的保留条数（幂等去重窗口）；超出后最老的终态任务被回收，活动任务永不回收
governor.retained-terminal-tasks=1000
